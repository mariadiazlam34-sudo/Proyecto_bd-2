<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Tienda — Contáctanos</title>

  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="formulario.css" />
</head>

<body>
  <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo">Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="contenedor" id="inicio">
    <div class="encabezado-principal">
      <h1>Formulario de Contacto</h1>
    </div>

    <div class="panel-tienda">
      <!-- SECCIÓN 1: Formulario de Registro -->
      <section class="tarjeta" id="registro">
        <h2 id="tituloFormulario">Contacto </h2>

        <form id="formularioContacto">
          <!-- Campo oculto para almacenar el ID en caso de edición -->
          <input type="hidden" id="mensajeId" value="" />

          <div class="campo">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required />
          </div>

          <div class="campo">
            <label for="precio">Correo:</label>
            <input type="email" id="correo" placeholder="Ej: ejemplo@correo.com" required />
          </div>

          <div class="campo">
            <label for="stock">Mensaje:</label>
            <input type="textarea" id="mensaje" placeholder="Ej: Tengo una pregunta..." required />
          </div>

          <div class="acciones-form">
            <button type="submit" id="btnGuardar" class="btn btn-guardar">Guardar Producto</button>
            <button type="button" id="btnCancelar" class="btn btn-cancelar" style="display: none;">Cancelar</button>
          </div>
        </form>
      </section>

    </div>
      <!-- SECCIÓN 2: Lista de Productos -->
      <section class="tarjeta" id="productos">
        <h2>Lista de Mensajes</h2>
        <div id="listaMensajes" class="lista-Mensajes">
          <!-- Los productos se cargan desde app.js -->
        </div>
      </section>
  </main>

  <!-- ===== PIE DE PÁGINA (FOOTER) ===== -->
  <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
